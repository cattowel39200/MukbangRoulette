function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}
function isOnline(){if(typeof Android!=='undefined'&&Android.isOnline)try{return Android.isOnline()}catch(e){}return navigator.onLine!==false}
function hav(a,b,c,d){var R=6371e3,p=Math.PI/180,x=Math.sin((c-a)*p/2),y=Math.sin((d-b)*p/2);return R*2*Math.asin(Math.sqrt(x*x+Math.cos(a*p)*Math.cos(c*p)*y*y))}

// ═══ Base64 디코드 ═══
function b64decode(s){try{return decodeURIComponent(escape(atob(s)))}catch(e){try{return atob(s)}catch(e2){return''}}}

// ═══════════════════════════════════════
// 카카오 카테고리 → 분류 매핑
// ═══════════════════════════════════════
var MIC={"고기":"🥩","면류":"🍜","국/탕":"🍲","치킨":"🍗","돈까스":"🍱","회/초밥":"🍣","해산물":"🦀","피자/파스타":"🍕","족발/보쌈":"🦶","버거":"🍔","백반":"🍚","분식":"🧆","중식":"🥟","카레":"🍛","기타":"🍽️"};
var COL=["#E74C3C","#E67E22","#D4A017","#2ECC71","#1ABC9C","#3498DB","#9B59B6","#E91E63","#FF5722","#795548","#607D8B","#00BCD4","#FF6F61","#6B5B95","#88B04B","#F7CAC9","#92A8D1","#955251","#B565A7","#009B77"];

// 카카오 category_name → {cu, mu}
function classifyKakao(cat,name){
  cat=cat||'';name=name||'';var cn=cat+' '+name;
  var cu='한식',mu='기타';
  // 카테고리 기반 (가장 정확)
  if(/양식/.test(cat))cu='양식';
  else if(/일식/.test(cat))cu='일식';
  else if(/중식/.test(cat))cu='중식';
  else if(/분식/.test(cat)){cu='분식';mu='분식'}
  else if(/인도/.test(cat))cu='기타';
  // 세부 메뉴 — cat+name 통합 매칭으로 정확도 향상
  if(/육류|고기|구이|삼겹|갈비|곱창|막창/.test(cat)||/삼겹|갈비|불고기|고기|한우|돼지|구이|곱창|막창|대패|숯불|연탄|양고기|lamb|스테이크|steak|소고기|목살|항정살|차돌|뒷고기|흑돼지|생고기|왕갈비|갈매기살|꽃등심|안심|등심|양념갈비|소갈비|돼갈비|육회|bbq/i.test(name))mu='고기';
  else if(/국수|면/.test(cat)||/국수|칼국수|냉면|막국수|밀면|라멘|ramen|우동|소바|soba|쌀국수|pho|짬뽕|잔치국수|비빔국수|쫄면|메밀|모밀/i.test(name))mu='면류';
  else if(/국밥|탕|찌개|전골/.test(cat)||/국밥|해장|감자탕|설렁탕|곰탕|찌개|부대|육개장|삼계탕|매운탕|수육국밥|뼈해장|선지|내장탕|갈비탕|추어탕|도가니|사골|순댓국|뚝배기|된장|김치찌개|청국장|순두부/i.test(name))mu='국/탕';
  else if(/치킨|닭/.test(cat)||/치킨|통닭|닭강정|찜닭|닭발|닭볶음탕|닭갈비|치맥|fried.*chicken|chicken/i.test(name))mu='치킨';
  else if(/돈까스|돈가스|카츠/.test(cat)||/돈까스|돈가스|카츠|커틀렛|cutlet|텐동|경양식|토ンカ/i.test(name))mu='돈까스';
  else if(/초밥|회/.test(cat)||/초밥|스시|sushi|횟집|회센터|사시미|sashimi|오마카세|omakase|활어|광어|연어|참치회/i.test(name))mu='회/초밥';
  else if(/해물|해산물|수산/.test(cat)||/수산|해산물|조개|대게|게장|조개구이|굴|새우|랍스터|lobster|꽃게|킹크랩|전복|가리비|해물찜|해물탕|낙지|주꾸미|오징어|아귀/i.test(name))mu='해산물';
  else if(/피자|파스타/.test(cat)||/피자|pizza|파스타|pasta|리조또|risotto/i.test(name))mu='피자/파스타';
  else if(/족발|보쌈/.test(cat)||/족발|보쌈|쟁반국수/i.test(name))mu='족발/보쌈';
  else if(/버거|햄버거/.test(cat)||/버거|햄버거|burger|샌드위치|sandwich/i.test(name))mu='버거';
  else if(/백반|정식|한정식|가정/.test(cat)||/백반|정식|한정식|가정식|집밥|쌈밥|비빔밥|제육|돌솥|보리밥|쭈꾸미|불백|낙곱새|곤드레|산채|시골밥상|코다리|생선구이/i.test(name))mu='백반';
  else if(/중식/.test(cat)||/중화|짬뽕|짜장|탕수육|마라|양꼬치|훠궈|딤섬|마라탕|마라샹궈|중국집|북경|사천|유린기|깐풍기|동파육/i.test(name))mu='중식';
  else if(/분식/.test(cat)||/떡볶이|순대|김밥|라볶이|튀김|만두|핫도그|어묵|오뎅|쫄볶이|떡꼬치|붕어빵/i.test(name))mu='분식';
  else if(/카레|curry/i.test(cn))mu='카레';
  // 양식 세부 판별 (기본값 대신 이름 기반)
  if(mu==='기타'&&cu==='양식'){
    if(/스테이크|steak|그릴|grill/i.test(name))mu='고기';
    else if(/파스타|pasta|리조또|risotto|뇨끼/i.test(name))mu='피자/파스타';
    else if(/버거|burger|샌드위치/i.test(name))mu='버거';
    else mu='피자/파스타';
  }
  // 일식 세부 판별
  if(mu==='기타'&&cu==='일식'){
    if(/라멘|ramen|우동|소바|soba/i.test(name))mu='면류';
    else if(/카츠|돈까스|돈가스|텐동/i.test(name))mu='돈까스';
    else if(/이자카야|야키토리|꼬치/i.test(name))mu='기타';
    else mu='회/초밥';
  }
  return{cu:cu,mu:mu};
}

// ═══ 제외 필터 (비음식점) ═══
// place_name 기반 필터는 최소화 — category 기반 판별을 parseKakao에서 수행
var SKIP_NAME=/편의점|GS25|CU마트|세븐일레븐|이마트24|미니스톱/i;
var SKIP_CAT=/카페|커피|coffee|cafe|빵집|베이커리|bakery|디저트|dessert|아이스크림|juice|주스/i;

// ═══ 태그 ═══
var TAGS=[
  {k:"점심",i:"☀️",t:"scene",pr:["백반","면류","돈까스","국/탕","피자/파스타","분식"],av:[]},
  {k:"저녁",i:"🌙",t:"scene",pr:["고기","회/초밥","해산물"],av:[]},

  {k:"국·탕",i:"🍲",t:"menu",mu:"국/탕"},

  {k:"돈까스",i:"🍱",t:"menu",mu:"돈까스"},
  {k:"양식",i:"🍕",t:"menu",mu:"피자/파스타"},
  {k:"데이트",i:"💕",t:"scene",pr:["피자/파스타","회/초밥","돈까스"],av:["국/탕"],cp:["양식","일식"]},
  {k:"술안주",i:"🍺",t:"scene",pr:["고기","치킨","족발/보쌈","해산물","중식","회/초밥"],av:["백반","버거","분식","카레","돈까스","면류","기타","피자/파스타","국/탕"]},
  {k:"해장",i:"🥴",t:"scene",pr:["국/탕"],av:["피자/파스타"]},
  {k:"즐겨찾기",i:"💛",t:"fav"}
];

// ═══ 상태 ═══
var myLat=0,myLon=0,myAddr='',allR=[],curList=[];
var activeTag=null,spn=false,rot=0,selR=null,errorMsg='';
var hist=[];try{hist=JSON.parse(localStorage.getItem('mkr_hist')||'[]')}catch(e){hist=[]}
var radius=1000,actx=null,rmap=null;
var favs=[];try{favs=JSON.parse(localStorage.getItem('mkr_favorites')||'[]')}catch(e){favs=[]}
var _detailR=null,_batchQueue=[],_batchIdx=0;

function popScore(r){return(r.rating||0)*30+(r.blogCnt||0)*3+(r.ratingCnt||0)*5+(r.commentCnt||0)*2}

// ═══ XHR ═══
function xhrGet(url,ms,headers,cb){
  try{var x=new XMLHttpRequest();x.open('GET',url,true);x.timeout=ms;
  if(headers){for(var k in headers)x.setRequestHeader(k,headers[k])}
  x.onload=function(){cb(null,x.status,x.responseText)};
  x.onerror=function(){cb('네트워크오류')};
  x.ontimeout=function(){cb('타임아웃')};
  x.send()}catch(e){cb(e.message)}
}

// ═══════════════════════════════════════
// 카카오 로컬 API 검색 (네이티브 브릿지)
// ═══════════════════════════════════════
var _kakaoCallbacks={};
function kakaoSearch(lat,lon,rad,page,cb){
  if(typeof Android!=='undefined'&&Android.kakaoSearch){
    var cbKey='ks_'+page+'_'+Date.now();
    _kakaoCallbacks[cbKey]=cb;
    Android.kakaoSearch(lat,lon,rad,page,'_onKakaoResult_'+cbKey);
    window['_onKakaoResult_'+cbKey]=function(code,b64){
      delete window['_onKakaoResult_'+cbKey];
      var fn=_kakaoCallbacks[cbKey];delete _kakaoCallbacks[cbKey];
      if(!fn)return;
      if(code<200||code>=300){fn(code===401?'API키오류':code===-2?'연결시간초과':code===-3?'인터넷연결확인':code===-4?'보안연결오류':code===-5?'네트워크오류':'HTTP'+code);return}
      if(!b64){fn('빈응답');return}
      try{var d=JSON.parse(b64decode(b64));fn(null,d)}catch(e){fn('JSON오류')}
    };
    return;
  }
  // 웹 폴백 (개발용)
  var key='';try{key=localStorage.getItem('mkr_kakao_key')||''}catch(e){}
  if(!key){cb('API키없음');return}
  var url='https://dapi.kakao.com/v2/local/search/category.json'
    +'?category_group_code=FD6'
    +'&x='+lon+'&y='+lat
    +'&radius='+rad
    +'&size=15&page='+page
    +'&sort=accuracy';
  xhrGet(url,10000,{'Authorization':'KakaoAK '+key},function(err,status,text){
    if(err){cb(err);return}
    if(status===401){cb('API키오류');return}
    if(status<200||status>=300){cb('HTTP'+status);return}
    try{var d=JSON.parse(text);cb(null,d)}catch(e){cb('JSON오류')}
  });
}

// 여러 페이지 가져오기 (최대 5페이지 = 75곳)
var KAKAO_MAX_PAGE=5;
function kakaoSearchAll(lat,lon,rad,done){
  S('맛집 검색 중...');
  var allDocs=[];
  function fetchPage(page){
    kakaoSearch(lat,lon,rad,page,function(err,d){
      if(err){if(allDocs.length>0)done(null,allDocs);else done(err,[]);return}
      var docs=d.documents||[];
      allDocs=allDocs.concat(docs);
      if(page<KAKAO_MAX_PAGE&&d.meta&&!d.meta.is_end&&docs.length>=15){
        S('추가 검색 중... ('+allDocs.length+'곳)');
        fetchPage(page+1);
      }else{done(null,allDocs)}
    });
  }
  fetchPage(1);
}

// 카카오 결과 → 내부 형식
function parseKakao(docs){
  var res=[],seen={},i;
  for(i=0;i<docs.length;i++){
    try{
      var d=docs[i];
      var name=d.place_name;if(!name)continue;
      name=name.replace(/\s+/g,' ').trim();
      if(name.length<2)continue;
      // 편의점 등 확실한 비음식점만 이름으로 제외
      if(SKIP_NAME.test(name))continue;
      // 카테고리가 FD6(음식점)이면 카페/디저트 이름이어도 통과
      var catGroup=d.category_group_code||'';
      if(catGroup!=='FD6'&&SKIP_CAT.test(d.category_name||''))continue;
      // FD6이더라도 카테고리에 카페/디저트만 있고 음식 카테고리가 없으면 제외
      if(catGroup==='FD6'&&SKIP_CAT.test(d.category_name||'')&&!/음식점|한식|양식|일식|중식|분식/.test(d.category_name||''))continue;
      if(seen[name])continue;seen[name]=1;
      var lat=parseFloat(d.y),lon=parseFloat(d.x);
      if(!lat||!lon)continue;
      var di=d.distance?parseInt(d.distance):Math.round(hav(myLat,myLon,lat,lon));
      var cl=classifyKakao(d.category_name,name);
      res.push({
        id:'k'+i,name:name,
        cu:cl.cu,mu:cl.mu,
        di:di,lat:lat,lon:lon,
        cl:COL[res.length%COL.length],
        ic:MIC[cl.mu]||'🍽️',
        score:50,reason:'',
        phone:d.phone||'',
        addr:d.road_address_name||d.address_name||'',
        url:d.place_url||'',
        cat:d.category_name||''
      });
    }catch(e){}
  }
  // 거리순 정렬 제거 — getList()에서 popScore 기반 정렬
  _log('카카오파싱:'+res.length);
  return res;
}

// ═══ 리스트 ═══
function getList(){
  var tag=null,i,pool=[];
  if(activeTag){for(i=0;i<TAGS.length;i++){if(TAGS[i].k===activeTag){tag=TAGS[i];break}}}
  // 즐겨찾기 태그: 반경 무관, 전체 allR + favs 에서 매칭
  if(tag&&tag.t==='fav'){
    var fList=[];
    for(i=0;i<favs.length;i++){
      var f=favs[i],found=null;
      for(var j=0;j<allR.length;j++){if(allR[j].name===f.name&&allR[j].url===f.url){found=copyR(allR[j]);break}}
      if(!found){found={id:'f'+i,name:f.name,cu:f.cu||'',mu:f.mu||'',di:f.di||0,lat:f.lat||0,lon:f.lon||0,cl:f.cl||COL[i%COL.length],ic:f.ic||'🍽️',score:50,reason:'',phone:f.phone||'',addr:f.addr||'',url:f.url||'',cat:f.cat||'',rating:f.rating||0,ratingCnt:f.ratingCnt||0,blogCnt:f.blogCnt||0,commentCnt:f.commentCnt||0,totalReviews:f.totalReviews||0};
        if(myLat&&myLon&&found.lat&&found.lon)found.di=Math.round(hav(myLat,myLon,found.lat,found.lon));}
      found.reason='💛 즐겨찾기';fList.push(found);
    }
    return fList;
  }
  // 반경 내 전체 pool
  for(i=0;i<allR.length;i++){if(allR[i].di<=radius)pool.push(copyR(allR[i]))}
  // 태그 필터를 먼저 적용 (pool에서 필터)
  if(tag&&tag.t==='menu'){
    var fil=[];for(i=0;i<pool.length;i++){if(pool[i].mu===tag.mu)fil.push(pool[i])}
    pool=fil;
  }
  if(tag&&tag.t==='scene'){
    var pref=[],rest=[];
    for(i=0;i<pool.length;i++){var r=pool[i],s=50;var rr=r.rating||0;
      if(r.totalReviews<=5)continue;
      s+=Math.round(rr*8);
      if(r.totalReviews>=10)s+=5;if(r.totalReviews>=30)s+=5;if(r.totalReviews>=50)s+=5;
      if(tag.cp&&tag.cp.indexOf(r.cu)>=0)s+=10;
      var isPref=tag.pr&&tag.pr.indexOf(r.mu)>=0;
      var isAv=tag.av&&tag.av.indexOf(r.mu)>=0;
      if(isPref){s+=20;r.reason=tag.k+'에 딱 맞는 '+r.mu}
      r.score=Math.max(s,5);
      if(isPref){pref.push(r)}
      else if(!isAv&&s>=30){rest.push(r)}
    }
    pref.sort(function(a,b){return b.score-a.score});
    rest.sort(function(a,b){return b.score-a.score});
    var sc=pref.slice(0,MAX_WHEEL);
    if(sc.length<MAX_WHEEL)sc=sc.concat(rest.slice(0,MAX_WHEEL-sc.length));
    return sc.slice(0,MAX_WHEEL);
  }
  // popScore 기반 맛집 우선순위 정렬
  var qualified=[],lowReview=[];
  for(i=0;i<pool.length;i++){
    var ps=popScore(pool[i]);pool[i].score=50+Math.round(ps);pool[i]._ps=ps;
    if(pool[i].totalReviews>5){qualified.push(pool[i])}
    else{lowReview.push(pool[i])}
  }
  qualified.sort(function(a,b){return b._ps-a._ps});
  // 맛집이 부족하면 리뷰 적은 곳을 거리순으로 보충
  if(qualified.length<MAX_WHEEL){
    lowReview.sort(function(a,b){return a.di-b.di});
    qualified=qualified.concat(lowReview.slice(0,MAX_WHEEL-qualified.length));
  }
  return qualified.slice(0,MAX_WHEEL);
}

function drawWheel(list){

  var w=[],tot=0,i;for(i=0;i<list.length;i++){w.push(Math.max(list[i].score,5));tot+=w[i]}
  var angle=-90;cv._segs=[];
  for(i=0;i<list.length;i++){var r=list[i],sw=(w[i]/tot)*360;cv._segs.push(angle+sw/2);var sa=angle*Math.PI/180,ea=(angle+sw)*Math.PI/180;
    ctx.beginPath();ctx.moveTo(C,C);ctx.arc(C,C,R,sa,ea);ctx.closePath();

    ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=.5;ctx.stroke();

      ctx.font=(fs+2)+'px sans-serif';ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(r.ic,0,sw>12?-4:0);
      if(sw>12){ctx.font='bold '+fs+'px sans-serif';var nm=r.name.length>5?r.name.substring(0,5)+'…':r.name;ctx.fillText(nm,0,11)}
      ctx.restore()}angle+=sw}
  ctx.beginPath();ctx.arc(C,C,20,0,Math.PI*2);var cg=ctx.createRadialGradient(C,C,0,C,C,20);cg.addColorStop(0,'#fff');cg.addColorStop(1,'#e0e0e0');ctx.fillStyle=cg;ctx.fill();

var _batchLoading=false,_batchAborted=false,_batchDone=null;
function fetchBatchRatings(list,done){
  _batchAborted=false;_batchQueue=[];_batchIdx=0;_batchLoading=true;_batchDone=done||null;
  var count=0;
  for(var i=0;i<list.length&&count<40;i++){
    if(!list[i].rating&&list[i].url){_batchQueue.push(list[i]);count++}
  }
  if(_batchQueue.length>0){_showBatchProgress();_fetchNextBatch()}
  else{_batchLoading=false;if(_batchDone){_batchDone();_batchDone=null}}
}
function _showBatchProgress(){
  if(isLoading){S('평점 확인 중... ('+_batchIdx+'/'+_batchQueue.length+')')}
  else{var el=document.getElementById('rstat');if(el)el.innerHTML='<span style="font-size:10px;color:#FFD700;animation:pu 1.5s infinite">⭐ 평점 불러오는 중... ('+_batchIdx+'/'+_batchQueue.length+')</span>'}
}
function _fetchNextBatch(){
  if(_batchAborted||_batchIdx>=_batchQueue.length){_batchLoading=false;if(_batchDone){_batchDone();_batchDone=null}else{render()}return}
  var r=_batchQueue[_batchIdx];_batchIdx++;
  var pid=getPlaceId(r.url);if(!pid){setTimeout(_fetchNextBatch,30);return}
  var detailUrl='https://place-api.map.kakao.com/places/panel3/'+pid;
  if(typeof Android!=='undefined'&&Android.fetchUrl){
    var cbKey='_batch_'+_batchIdx+'_'+Date.now();
    window[cbKey]=function(code,b64){
      delete window[cbKey];
      if(code>=200&&code<400&&b64){
        try{var text=b64decode(b64);var d=JSON.parse(text);_applyBatchRating(d,r)}catch(e){}
      }
      _showBatchProgress();setTimeout(_fetchNextBatch,50);
    };
    Android.fetchUrl(detailUrl,cbKey);
  }else{
    xhrGet(detailUrl,8000,null,function(err,status,text){
      if(!err&&status>=200&&status<300&&text){try{_applyBatchRating(JSON.parse(text),r)}catch(e){}}
      _showBatchProgress();setTimeout(_fetchNextBatch,50);
    });
  }
}
function _applyBatchRating(d,r){
  var kr=d.kakaomap_review||{};var ss=kr.score_set||{};
  var br=d.blog_review||{};
  if(!ss.review_count)return;
  var score=ss.average_score||0;
  var scoreCnt=ss.review_count||0;
  var blogCnt=br.review_count||0;
  var totalRev=scoreCnt+blogCnt;
  for(var i=0;i<allR.length;i++){
    if(allR[i].name===r.name&&allR[i].url===r.url){
      allR[i].rating=score;allR[i].ratingCnt=scoreCnt;
      allR[i].blogCnt=blogCnt;allR[i].commentCnt=0;
      allR[i].totalReviews=totalRev;break;
    }

function parseBlogMenu(docs){
  var found={},results=[],i,j;
  var priceRe=/([가-힣a-zA-Z]{2,12})\s*[:·\-~]\s*(\d{1,3}[,.]?\d{3})\s*원/g;
  var priceRe2=/([가-힣]{2,8})\s+(\d{1,2}[,.]?\d{3,4})\s*원/g;
  for(i=0;i<docs.length;i++){
    var txt=(docs[i].title||'').replace(/<[^>]+>/g,'')+' '+(docs[i].contents||'').replace(/<[^>]+>/g,'');
    var m;
    priceRe.lastIndex=0;
    while((m=priceRe.exec(txt))!==null){
      var mn=m[1].trim(),mp=parseInt(m[2].replace(/[,.]/g,''));
      if(mn&&mp>0&&mp<500000&&!found[mn]){found[mn]=1;results.push({name:mn,price:mp.toLocaleString()+'원'})}
    }
    priceRe2.lastIndex=0;
    while((m=priceRe2.exec(txt))!==null){
      var mn2=m[1].trim(),mp2=parseInt(m[2].replace(/[,.]/g,''));
      if(mn2&&mp2>0&&mp2<500000&&!found[mn2]){found[mn2]=1;results.push({name:mn2,price:mp2.toLocaleString()+'원'})}
    }
  }
  return results.slice(0,5);
}

function tapTag(k){activeTag=activeTag===k?null:k;render()}

// 현재위치 갱신
function relocate(){
  if(!navigator.geolocation)return;
  var btn=document.getElementById('locBtn');
  if(btn){btn.style.opacity='.4';btn.textContent='⏳'}
  navigator.geolocation.getCurrentPosition(
    function(pos){
      myLat=pos.coords.latitude;myLon=pos.coords.longitude;
      xhrGet('https://nominatim.openstreetmap.org/reverse?format=json&lat='+myLat+'&lon='+myLon+'&zoom=16&accept-language=ko',6000,{'User-Agent':APP_NAME+'/'+APP_VER},function(err,status,text){
        if(!err&&text){try{var d=JSON.parse(text).address||{};myAddr=d.borough||d.suburb||d.neighbourhood||d.town||d.city||d.county||myAddr;if(d.road)myAddr=d.road+', '+myAddr}catch(e){}}
        forceRefresh=true;isLoading=true;S('위치 갱신...');doSearch();
      });
    },
    function(){if(btn){btn.style.opacity='1';btn.textContent='📍'}alert('위치를 가져올 수 없습니다')},
    {enableHighAccuracy:true,timeout:10000,maximumAge:0}
  );
}

// ═══ 카페 검색 ═══
var _cafeCallbacks={};
function cafeSearchApi(lat,lon,rad,page,cb){
  if(typeof Android!=='undefined'&&Android.cafeSearch){
    var cbKey='cf_'+page+'_'+Date.now();
    _cafeCallbacks[cbKey]=cb;
    window['_onCafeResult_'+cbKey]=function(code,b64){
      delete window['_onCafeResult_'+cbKey];
      var fn=_cafeCallbacks[cbKey];delete _cafeCallbacks[cbKey];
      if(!fn)return;
      if(code<200||code>=300){fn('HTTP'+code);return}
      if(!b64){fn('빈응답');return}
      try{var d=JSON.parse(b64decode(b64));fn(null,d)}catch(e){fn('JSON오류')}
    };
    Android.cafeSearch(lat,lon,rad,page,'_onCafeResult_'+cbKey);
    return;
  }
  cb('브릿지없음');
}
function searchCafe(){
  if(!myLat||!myLon){alert('위치 정보가 없습니다');return}
  if(rmap){rmap.remove();rmap=null}
  var raEl=document.getElementById('ra');if(raEl)raEl.innerHTML='';
  var searchRad=Math.min(Math.round(radius*1.2),20000);
  showCafeLoading();
  cafeSearchApi(myLat,myLon,searchRad,1,function(err,d1){
    if(err){showCafeResult([],err);return}
    var docs=d1.documents||[];
    if(d1.meta&&!d1.meta.is_end&&docs.length>=15){
      cafeSearchApi(myLat,myLon,searchRad,2,function(err2,d2){
        if(!err2&&d2.documents)docs=docs.concat(d2.documents);
        showCafeResult(parseCafeDocs(docs));
      });
    }else{showCafeResult(parseCafeDocs(docs))}
  });
}
function parseCafeDocs(docs){
  var res=[],seen={},i;
  for(i=0;i<docs.length;i++){
    try{
      var d=docs[i],name=d.place_name;if(!name)continue;
      name=name.replace(/\s+/g,' ').trim();
      if(name.length<2||seen[name])continue;seen[name]=1;
      // 편의점/마트 제외
      if(/편의점|mart|GS25|CU|세븐일레븐|이마트/i.test(name))continue;
      var lat=parseFloat(d.y),lon=parseFloat(d.x);if(!lat||!lon)continue;
      var di=d.distance?parseInt(d.distance):Math.round(hav(myLat,myLon,lat,lon));
      if(di>radius)continue;
      res.push({name:name,di:di,lat:lat,lon:lon,phone:d.phone||'',addr:d.road_address_name||d.address_name||'',url:d.place_url||'',cat:d.category_name||''});
    }catch(e){}
  }
  res.sort(function(a,b){return a.di-b.di});
  return res;
}
function showCafeLoading(){
  if(rmap){rmap.remove();rmap=null}
  var raEl=document.getElementById('ra');if(raEl)raEl.innerHTML='';
  document.getElementById('modal').innerHTML='<div class="modal"><div class="modal-box" style="text-align:center;padding:40px">'
    +'<div style="font-size:36px">☕</div>'
    +'<div class="ld"></div>'
    +'<div style="font-size:12px;color:#666;margin-top:8px">주변 카페 검색 중...</div>'
    +'</div></div>';
}
function showCafeResult(list,err){
  if(rmap){rmap.remove();rmap=null}
  var raEl=document.getElementById('ra');if(raEl)raEl.innerHTML='';
  var rlb=radius>=1000?(radius/1000)+'km':radius+'m';
  var h='<div class="modal" onclick="if(event.target===this)closeSettings()"><div class="modal-box" style="max-width:380px">'
    +'<div style="font-size:16px;font-weight:900;color:#8B5E3C;margin-bottom:4px">☕ 주변 카페</div>'
    +'<div style="font-size:10px;color:#555;margin-bottom:14px">반경 '+rlb+' · '+list.length+'곳</div>';
  if(list.length===0){
    if(err){h+='<div style="text-align:center;padding:30px 0"><div style="font-size:36px">⚠️</div><div style="font-size:13px;color:#E74C3C;margin-top:8px">카페 검색 중 오류가 발생했습니다</div><div style="font-size:10px;color:#555;margin-top:4px">'+esc(err)+'</div></div>'}
    else{h+='<div style="text-align:center;padding:30px 0"><div style="font-size:36px">😅</div><div style="font-size:12px;color:#666;margin-top:8px">주변에 카페가 없습니다</div></div>'}
  }else{
    h+='<div style="max-height:55vh;overflow-y:auto">';
    var mx=Math.min(list.length,30);
    for(var i=0;i<mx;i++){
      var c=list[i],dm=c.di>=1000?(c.di/1000).toFixed(1)+'km':c.di+'m';
      var walkMin=Math.max(1,Math.round(c.di/67));
      h+='<div onclick="openKakaoPlace(\''+esc(c.url)+'\')" style="display:flex;align-items:center;gap:8px;padding:10px 4px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer">';
      h+='<span style="font-size:20px">☕</span>';
      h+='<div style="flex:1;min-width:0">';
      h+='<div style="font-size:12px;font-weight:700;color:#ddd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(c.name)+'</div>';
      h+='<div style="font-size:9px;color:#666;margin-top:2px">'+esc(c.addr)+'</div>';
      h+='</div>';
      h+='<div style="text-align:right;flex-shrink:0">';
      h+='<div style="font-size:11px;font-weight:700;color:#8B5E3C">'+dm+'</div>';
      h+='<div style="font-size:9px;color:#555">도보 '+walkMin+'분</div>';
      h+='</div></div>';
    }
    if(list.length>30)h+='<div style="text-align:center;font-size:9px;color:#444;padding:8px">외 '+(list.length-30)+'곳</div>';
    h+='</div>';
  }
  h+='<button class="b" onclick="closeSettings()" style="display:block;width:100%;margin-top:14px;padding:10px;border-radius:12px;font-size:13px;font-weight:700;background:rgba(255,255,255,.06);color:#888">닫기</button>';
  h+='</div></div>';
  document.getElementById('modal').innerHTML=h;
}

// ═══ 검색 ═══
var forceRefresh=false;
function doSearch(){
  _batchAborted=true;errorMsg='';
  if(!isOnline()){errorMsg='인터넷연결확인';allR=[];isLoading=false;render();return}
  if(!forceRefresh){var cached=loadC(myLat,myLon,radius);if(cached&&cached.length>0){
    for(var ci=0;ci<cached.length;ci++){if(cached[ci].lat&&cached[ci].lon)cached[ci].di=Math.round(hav(myLat,myLon,cached[ci].lat,cached[ci].lon))}
    allR=cached;
    var needRating=false;for(ci=0;ci<allR.length;ci++){if(!allR[ci].rating&&allR[ci].url){needRating=true;break}}
    if(needRating){S('평점 확인 중...');fetchBatchRatings(allR,function(){saveC(myLat,myLon,radius,allR);isLoading=false;render()})}
    else{isLoading=false;render()}
    return;
  }}
  forceRefresh=false;
  var searchRad=Math.min(Math.round(radius*1.5),20000);
  var lb=radius>=1000?(radius/1000)+'km':radius+'m';
  S('반경 '+lb+' 맛집 검색 중...');
  kakaoSearchAll(myLat,myLon,searchRad,function(err,docs){
    if(err){_log('카카오오류:'+err);
      allR=[];errorMsg=err;_initCalled=false;isLoading=false;render();return;
    }
    errorMsg='';allR=parseKakao(docs);
    S('평점 확인 중... (0/'+allR.length+')');
    fetchBatchRatings(allR,function(){
      saveC(myLat,myLon,radius,allR);
      isLoading=false;render();
    });
  });
}

// ═══ 업데이트 체크 ═══
function checkUpdate(){
  xhrGet(UPDATE_URL+'?t='+Date.now(),8000,{},function(err,status,text){
    if(err||status!==200)return;
    try{
      var d=JSON.parse(text);
      if(d.versionCode>APP_VCODE){
        var h='<div class="modal" onclick="if(event.target===this)closeSettings()"><div class="modal-box" style="text-align:center;max-width:320px">'
          +'<div style="font-size:40px;margin-bottom:8px">🆕</div>'
          +'<div style="font-size:16px;font-weight:900;color:#FFD700;margin-bottom:4px">업데이트 안내</div>'
          +'<div style="font-size:13px;color:#aaa;margin-bottom:6px">v'+d.versionName+' 출시!</div>'
          +'<div style="font-size:11px;color:#888;margin-bottom:16px;line-height:1.6;white-space:pre-line">'+esc(d.releaseNotes||'')+'</div>'
          +'<a href="'+esc(d.apkUrl||DOWNLOAD_URL)+'" style="display:inline-block;padding:12px 32px;border-radius:50px;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,#FFD700,#FF6B6B);text-decoration:none" '
          +'onclick="if(typeof Android!==\'undefined\'&&Android.openExternal){Android.openExternal(\''+esc(d.apkUrl||DOWNLOAD_URL)+'\');return false}">다운로드</a>'
          +'<div style="margin-top:12px"><button class="b" onclick="closeSettings()" style="font-size:12px;color:#555;background:none;padding:8px 16px">나중에</button></div>'
          +'</div></div>';
        document.getElementById('modal').innerHTML=h;
      }
    }catch(e){_log('updateCheck:'+e)}
  });
}

// ═══ 시작 ═══
window.onerror=function(msg,u,line){_log('err['+line+']:'+msg);return false};
var _initCalled=false;
function init(){
  if(_initCalled)return;_initCalled=true;
  isLoading=true;S('위치 확인 중...');
  checkUpdate();
  if(!isOnline()){document.getElementById('app').innerHTML='<div style="text-align:center;padding:80px 20px"><div style="font-size:48px">📡</div><div style="font-size:16px;font-weight:900;color:#FFD700;margin-top:10px">인터넷 연결 필요</div><button class="b" onclick="_initCalled=false;init()" style="margin-top:14px;padding:10px 28px;border-radius:25px;font-size:14px;font-weight:700;background:linear-gradient(135deg,#FFD700,#FF6B6B);color:#fff">다시 시도</button></div>';return}
  if(!navigator.geolocation){showGpsErr();return}
  navigator.geolocation.getCurrentPosition(
    function(pos){
      myLat=pos.coords.latitude;myLon=pos.coords.longitude;
      myAddr=myLat.toFixed(3)+', '+myLon.toFixed(3);
      xhrGet('https://nominatim.openstreetmap.org/reverse?format=json&lat='+myLat+'&lon='+myLon+'&zoom=16&accept-language=ko',6000,{'User-Agent':APP_NAME+'/'+APP_VER},function(err,status,text){
        if(!err&&text){try{var d=JSON.parse(text).address||{};myAddr=d.borough||d.suburb||d.neighbourhood||d.town||d.city||d.county||myAddr;if(d.road)myAddr=d.road+', '+myAddr}catch(e){}}
        doSearch();
      });
    },
    function(){showGpsErr()},
    {enableHighAccuracy:true,timeout:15000,maximumAge:120000}
  );
}
function showGpsErr(){isLoading=false;_initCalled=false;document.getElementById('app').innerHTML='<div style="text-align:center;padding:80px 20px"><div style="font-size:48px">📍</div><div style="font-size:16px;font-weight:900;color:#FFD700;margin-top:10px">위치 권한 필요</div><div style="font-size:12px;color:#666;margin-top:8px;line-height:1.5">주변 맛집을 찾으려면<br>위치 접근을 허용해 주세요</div><button class="b" onclick="init()" style="margin-top:14px;padding:10px 28px;border-radius:25px;font-size:14px;font-weight:700;background:linear-gradient(135deg,#FFD700,#FF6B6B);color:#fff">다시 시도</button></div>'}
init();
</script>
