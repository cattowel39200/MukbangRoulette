<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>먹방룰렛 - 오늘 뭐 먹지?</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.card{background:linear-gradient(145deg,#1a1a2e,#16213e);border-radius:24px;padding:40px 32px;max-width:400px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.icon{font-size:72px;margin-bottom:16px}
h1{font-size:28px;font-weight:900;background:linear-gradient(135deg,#FFD700,#FF6B6B);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:4px}
.ver{font-size:13px;color:#888;margin-bottom:20px}
.desc{font-size:14px;color:#aaa;line-height:1.7;margin-bottom:28px}
.dl-btn{display:inline-block;padding:14px 40px;border-radius:50px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,#FFD700,#FF6B6B);text-decoration:none;transition:transform .2s,box-shadow .2s;box-shadow:0 4px 20px rgba(255,107,107,.3)}
.dl-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,107,107,.5)}
.dl-btn:active{transform:translateY(0)}
.features{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:24px 0}
.feat{background:rgba(255,255,255,.04);border-radius:12px;padding:14px 10px;text-align:center}
.feat-icon{font-size:24px;margin-bottom:4px}
.feat-text{font-size:11px;color:#999}
.notes{margin-top:24px;padding:16px;background:rgba(255,255,255,.03);border-radius:12px;text-align:left}
.notes h3{font-size:12px;color:#FFD700;margin-bottom:8px}
.notes ul{list-style:none;padding:0}
.notes li{font-size:11px;color:#888;padding:3px 0}
.notes li::before{content:'✓ ';color:#4CAF50}
.footer{margin-top:24px;font-size:10px;color:#444}
.size{font-size:11px;color:#666;margin-top:10px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎰</div>
  <h1>먹방룰렛</h1>
  <div class="ver" id="ver">v2.9.0</div>
  <div class="desc">주변 맛집을 룰렛으로 추천!<br>오늘 뭐 먹을지 고민 끝</div>

  <div class="features">
    <div class="feat"><div class="feat-icon">📍</div><div class="feat-text">GPS 기반<br>주변 맛집</div></div>
    <div class="feat"><div class="feat-icon">⭐</div><div class="feat-text">평점순<br>맛집 우선</div></div>
    <div class="feat"><div class="feat-icon">🎯</div><div class="feat-text">상황별<br>추천 태그</div></div>
    <div class="feat"><div class="feat-icon">💛</div><div class="feat-text">즐겨찾기<br>저장</div></div>
  </div>

  <a class="dl-btn" id="dlBtn" href="app-release.apk" download>다운로드 (APK)</a>
  <div class="size" id="apkSize"></div>

  <div class="notes">
    <h3>v2.9.0 업데이트</h3>
    <ul>
      <li>맛집 우선순위 추천으로 변경</li>
      <li>인기/평점 기반 정렬 적용</li>
      <li>검색 범위 확대로 더 많은 후보</li>
    </ul>
  </div>
</div>
<div class="footer">Android 5.0+ 지원</div>

<script>
fetch('version.json').then(r=>r.json()).then(d=>{
  document.getElementById('ver').textContent='v'+d.versionName;
}).catch(()=>{});
</script>
</body>
</html>
